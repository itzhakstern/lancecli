# Publishes to PyPI when you push a tag like v0.1.0.
# One-time setup: PyPI → Publishing → Trusted publishers
#   Owner: <github user>, Repository: lancecli, Workflow: publish.yml, Environment: pypi
# Also create a GitHub Environment named "pypi" (Settings → Environments).

name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build
        run: uv build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
