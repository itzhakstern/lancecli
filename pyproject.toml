[project]
name = "lancecli"
version = "0.1.0"
description = "Inspect and dump Lance datasets from the command line (parquet-tools equivalent)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["lance", "cli", "arrow", "dataset"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Utilities",
]
dependencies = [
    "pylance>=11.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/itzhakstern/lancecli"
Issues = "https://github.com/itzhakstern/lancecli/issues"

[project.scripts]
lancecli = "lancecli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lancecli"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.cursor",
    "/.github",
    "/.venv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
